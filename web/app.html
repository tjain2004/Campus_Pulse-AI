<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusPulse AI</title>
  <script>
    // apply the saved / system theme before paint (no flash)
    (function () {
      var t = null;
      try { t = localStorage.getItem("cp-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-changes" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 15a7 7 0 0 0 12.4 2.5M18.5 9A7 7 0 0 0 6.1 6.5"/></symbol>
  <symbol id="i-rumors" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-deadlines" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 13h4"/></symbol>
  <symbol id="i-groups" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
  <symbol id="i-resources" viewBox="0 0 24 24"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h9"/></symbol>
  <symbol id="i-whatsapp" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/></symbol>
  <symbol id="i-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
</svg>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Main">
    <div class="brand"><span class="pulse"><svg><use href="#i-pulse"/></svg></span>CampusPulse</div>
    <a href="#today"><svg class="i"><use href="#i-today"/></svg>Today</a>
    <a href="#changes"><svg class="i"><use href="#i-changes"/></svg>What changed</a>
    <a href="#rumors"><svg class="i"><use href="#i-rumors"/></svg>Rumor Shield</a>
    <a href="#deadlines"><svg class="i"><use href="#i-deadlines"/></svg>Deadlines</a>
    <a href="#tasks"><svg class="i"><use href="#i-tasks"/></svg>My tasks <span class="count hidden" id="count-tasks"></span></a>
    <a href="#ask"><svg class="i"><use href="#i-ask"/></svg>Ask Campus AI</a>
    <div class="nav-label">Sources</div>
    <a href="#groups"><svg class="i"><use href="#i-groups"/></svg>Groups</a>
    <a href="#resources"><svg class="i"><use href="#i-resources"/></svg>Resources</a>
    <a href="#whatsapp"><svg class="i"><use href="#i-whatsapp"/></svg>WhatsApp</a>
    <a href="#import"><svg class="i"><use href="#i-import"/></svg>Import chats</a>
    <div class="nav-label">Account</div>
    <a href="#profile"><svg class="i"><use href="#i-profile"/></svg>Profile</a>
    <div class="me">
      <div class="mini-avatar" id="me-avatar">?</div>
      <div class="who"><div id="me-name" style="font-weight:700;color:#fff"></div><div id="me-email" class="em"></div>
        <button id="logout-btn" type="button">Log out</button></div>
    </div>
  </nav>

  <div class="content">
    <header class="header">
      <button class="icon-btn menu-btn" id="menu-btn" aria-controls="nav" aria-expanded="false" aria-label="Open menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <span class="crumb" id="crumb">Today</span>
      <span class="spacer"></span>
      <a class="pill" href="#whatsapp" id="wa-pill"><span class="dot" id="wa-dot"></span><span id="wa-text">WhatsApp off</span></a>
      <button class="icon-btn" id="theme-btn" aria-label="Switch to dark mode"><svg class="i"><use href="#i-moon"/></svg></button>
    </header>
    <main id="main" tabindex="-1"><p class="muted"><span class="spinner"></span> Loading…</p></main>
  </div>
</div>

<!-- Pulse: rule-based campus chatbot -->
<button class="bot-fab" id="bot-fab" aria-label="Open Pulse chat" aria-expanded="false" aria-controls="bot">
  <svg><use href="#i-bot"/></svg><span class="badge" id="bot-badge"></span>
</button>
<section class="bot hidden" id="bot" role="dialog" aria-label="Pulse chat">
  <div class="bot-head">
    <span class="face"><svg><use href="#i-pulse"/></svg></span>
    <div><b>Pulse</b><small>Campus assistant, answers from your groups</small></div>
    <button id="bot-close" aria-label="Close chat"><svg class="i"><use href="#i-close"/></svg></button>
  </div>
  <div class="bot-body" id="bot-body" aria-live="polite"></div>
  <div class="bot-chips" id="bot-chips"></div>
  <form class="bot-form" id="bot-form">
    <input id="bot-input" type="text" maxlength="400" placeholder="Ask Pulse… e.g. what's due tomorrow?" aria-label="Message Pulse" autocomplete="off">
    <button type="submit" aria-label="Send"><svg><use href="#i-send"/></svg></button>
  </form>
</section>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chatbot.js"></script>
</body>
</html>
